# Runs the Mashghal dashboard itself.
#
#   docker compose up --build -d
#
# To bring the dashboard AND every app it links to up together (the normal
# "start the workshop" flow, e.g. after a reboot), use the wrapper script
# instead, which also drives the sibling repos' own compose files:
#
#   ./scripts/start.sh
#
# The dashboard mounts the host Docker socket both to read container state
# for the status dots and to start/stop each app's container from its card.
# It never touches other apps' compose projects, ports, or networks
# directly - it only starts/stops containers those projects already created.
#
# The `:ro` here only stops the container from replacing the socket file
# itself; it does NOT limit what's callable through it - Docker's API has
# no separate read-only mode, so this container effectively has the same
# control over the host's Docker daemon as the Docker CLI would. Treat it
# accordingly: keep the dashboard's port off the public internet.
services:
  dashboard:
    build: .
    image: mashghal:latest
    container_name: mashghal-dashboard
    ports:
      - "${DASHBOARD_PORT:-4000}:4000"
    environment:
      - PORT=4000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
